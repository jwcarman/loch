name: CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # Formatting and licence headers, before anything is compiled. Both are validate-phase goals,
  # so this is seconds of work, and failing it here means the answer is one command rather than
  # a scroll through a build log.
  check:
    name: Formatting and licence headers
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven

    - name: Check formatting and licence headers
      run: mvn -B spotless:check license:check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven

    # The JDBC tests run a real Postgres through Testcontainers, because the storage uses
    # advisory locks, recursive CTEs and FOR SHARE -- none of which an in-memory stand-in has.
    # Docker is already on ubuntu-latest, so there is nothing to install.
    - name: Build with Maven
      run: mvn -B verify
